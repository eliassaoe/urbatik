name: plu-extract

# Vérification du PLU avant paiement (supabase/functions/plu-check) : extrait le texte de la zone
# du règlement PDF et le renvoie à plu-check. Lancé par plu-check (repository_dispatch).
on:
  repository_dispatch:
    types: [plu-extract]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Masquer le jeton
        run: echo "::add-mask::${{ github.event.client_payload.token }}"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pymupdf
      - name: Extraire la zone
        env:
          CHECK_ID: ${{ github.event.client_payload.check_id }}
          CHECK_TOKEN: ${{ github.event.client_payload.token }}
          REGLEMENT_URL: ${{ github.event.client_payload.url }}
          ZONE: ${{ github.event.client_payload.zone }}
        run: python generateur/plu_extract.py
